<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer sound wave circles -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="url(#glow)" stroke-width="4" stroke-dasharray="12 16" opacity="0.4" />
  <circle cx="256" cy="240" r="190" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 20" opacity="0.25" />

  <!-- Wave bars around center -->
  <g transform="translate(256, 240)">
    <!-- Right waves (RTL voice reflection) -->
    <rect x="70" y="-30" width="8" height="60" rx="4" fill="url(#glow)" opacity="0.9" />
    <rect x="90" y="-55" width="8" height="110" rx="4" fill="url(#glow)" opacity="0.8" />
    <rect x="110" y="-38" width="8" height="76" rx="4" fill="url(#glow)" opacity="0.7" />
    <rect x="130" y="-18" width="8" height="36" rx="4" fill="url(#glow)" opacity="0.5" />

    <!-- Left waves -->
    <rect x="-78" y="-30" width="8" height="60" rx="4" fill="url(#glow)" opacity="0.9" />
    <rect x="-98" y="-55" width="8" height="110" rx="4" fill="url(#glow)" opacity="0.8" />
    <rect x="-118" y="-38" width="8" height="76" rx="4" fill="url(#glow)" opacity="0.7" />
    <rect x="-138" y="-18" width="8" height="36" rx="4" fill="url(#glow)" opacity="0.5" />
  </g>

  <!-- Center Microphone Capsule -->
  <g filter="url(#shadow)">
    <!-- Mic Body -->
    <rect x="220" y="160" width="72" height="130" rx="36" fill="url(#glow)" />
    <!-- Mic Inner Glow -->
    <rect x="228" y="168" width="56" height="50" rx="28" fill="#ffffff" opacity="0.3" />

    <!-- Mic Base Arc -->
    <path d="M 196 240 C 196 280 220 306 256 306 C 292 306 316 280 316 240" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    
    <!-- Mic Stand -->
    <line x1="256" y1="306" x2="256" y2="356" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="216" y1="356" x2="296" y2="356" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Persian Calligraphic Dot / Accent -->
  <circle cx="256" cy="115" r="9" fill="#38bdf8" />
  <circle cx="272" cy="100" r="7" fill="#818cf8" />
</svg>
